<!doctype html>
<!--
  The presence of this file switches Cloudflare out of single-page-application
  mode, in which every unknown path is answered with index.html and a cacheable
  "200 OK".

  That default is actively harmful here. Build output under /assets/ is
  content-hashed, so a request for a bundle that a deploy has not published yet
  used to be answered with HTML - status 200, four hours of public caching. The
  browser then stores markup under a .js address, refuses it as a module script
  ("Expected a JavaScript-or-Wasm module script"), and shows a blank screen for
  as long as the entry survives, even though the real file is on the server.

  This app has no client-side routes, so nothing ever needs the fallback.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Not found</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #081325;
        color: #f6f8ff;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0;
        font-size: 15px;
        color: rgba(246, 248, 255, 0.7);
      }
      a {
        color: #7ec8ff;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Not found</h1>
      <p>This address does not exist. <a href="/">Open MindooDB Teamgrid</a></p>
    </div>
  </body>
</html>
