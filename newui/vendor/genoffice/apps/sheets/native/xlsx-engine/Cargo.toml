[package]
name = "xlsx-sidecar"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
default = ["native"]
# Desktop-only subsystems: formula recalc (IronCalc) and legacy-format
# import (calamine). The browser (wasm32) build of the read path omits them.
native = ["dep:calamine", "dep:ironcalc"]

[[bin]]
name = "xlsx-sidecar"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
base64 = "0.22.1"
calamine = { version = "0.36.0", optional = true }
ironcalc = { version = "0.7.1", optional = true }
quick-xml = { version = "0.38", features = ["encoding"] }
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Session ids come from crypto.getRandomValues in the browser.
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
tempfile = "3"
