name: Test

on:
  push:
    branches: [main, feature/newui]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      # Production build with the test host, served by vite preview (see playwright.config.ts).
      # Includes the comparison of formula results with Excel (e2e/fidelity).
      - run: pnpm test:e2e
      # Results per workbook and function; also what `pnpm fidelity:accept` reads.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-report
          path: fidelity-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
